<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ImPoster — хостинг изображений и видео</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .box {
            border: 1px solid #00ff00;
            padding: 20px;
            box-shadow: 0 0 15px #00ff00;
            text-align: center;
            background: #000;
            width: 100%;
            max-width: 480px;
            border-radius: 8px;
        }
        h2 {
            margin-top: 0;
            letter-spacing: 3px;
            font-weight: bold;
            text-transform: none;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        .status {
            font-size: 12px;
            margin-bottom: 18px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed #004400;
            padding-bottom: 8px;
        }
        .tab-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tab-btn {
            background: transparent;
            color: #00aa00;
            border: 1px solid #00aa00;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: 0.25s;
            border-radius: 4px;
            font-size: 14px;
        }
        .tab-btn.active {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        input[type="file"] {
            margin: 15px 0;
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
            font-family: inherit;
            font-size: 15px;
            letter-spacing: 1px;
            border-radius: 4px;
        }
        button:hover {
            background: #00cc00;
            box-shadow: 0 0 12px #00ff00;
        }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        #imageResult, #videoResult {
            margin-top: 20px;
            display: none;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #111;
            color: #00ff00;
            border: 1px solid #00ff00;
            margin-top: 8px;
            resize: none;
            box-sizing: border-box;
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
        }
        .copy-btn {
            margin-top: 10px;
            background: #222;
            color: #00ff00;
            border: 1px solid #00ff00;
            font-weight: normal;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .copy-btn:hover {
            background: #004400;
        }
        .success-msg {
            color: #ffff00;
            display: none;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 0 0 4px #ffff00;
        }
        .video-preview {
            margin-top: 15px;
            background: #000;
            border: 1px solid #00ff00;
            border-radius: 4px;
            padding: 10px;
        }
        video {
            width: 100%;
            max-height: 300px;
            background: #000;
            outline: none;
            border-radius: 4px;
        }
        .note {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
        }
        hr {
            border-color: #003300;
            margin: 15px 0 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>⬡ ImPoster</h2>
        <div class="status">загрузка медиа</div>

        <div class="tab-row">
            <button class="tab-btn active" id="tabImageBtn">🖼 Изображение</button>
            <button class="tab-btn" id="tabVideoBtn">▶ Видео</button>
        </div>

        <div class="panel active" id="imagePanel">
            <input type="file" id="imageInput" accept="image/*">
            <button id="uploadImageBtn">ЗАГРУЗИТЬ ИЗОБРАЖЕНИЕ</button>
            <div id="imageSuccess" class="success-msg">✓ Изображение загружено!</div>
            <div id="imageResult">
                <textarea id="imageBbcode" readonly placeholder="BBCode появится здесь..."></textarea>
                <button class="copy-btn" id="copyImageBtn">СКОПИРОВАТЬ КОД</button>
            </div>
        </div>

        <div class="panel" id="videoPanel">
            <input type="file" id="videoInput" accept="video/*">
            <button id="uploadVideoBtn">ЗАГРУЗИТЬ ВИДЕО</button>
            <div id="videoSuccess" class="success-msg">✓ Видео загружено!</div>
            <div id="videoResult">
                <div class="video-preview">
                    <video id="videoPlayer" controls></video>
                </div>
                <textarea id="videoBbcode" readonly placeholder="BBCode / ссылка..."></textarea>
                <button class="copy-btn" id="copyVideoBtn">СКОПИРОВАТЬ КОД</button>
                <div class="note">Макс. размер: 32 МБ. Поддерживается MP4, WebM.</div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '683bf63eca1dcda6d0a46c4bf92e00c5';

        const tabImageBtn = document.getElementById('tabImageBtn');
        const tabVideoBtn = document.getElementById('tabVideoBtn');
        const imagePanel = document.getElementById('imagePanel');
        const videoPanel = document.getElementById('videoPanel');

        tabImageBtn.addEventListener('click', () => {
            tabImageBtn.classList.add('active');
            tabVideoBtn.classList.remove('active');
            imagePanel.classList.add('active');
            videoPanel.classList.remove('active');
        });

        tabVideoBtn.addEventListener('click', () => {
            tabVideoBtn.classList.add('active');
            tabImageBtn.classList.remove('active');
            videoPanel.classList.add('active');
            imagePanel.classList.remove('active');
        });

        document.getElementById('uploadImageBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('imageInput');
            const btn = document.getElementById('uploadImageBtn');
            const successMsg = document.getElementById('imageSuccess');
            const resultDiv = document.getElementById('imageResult');
            const originalText = btn.innerText;

            if (!fileInput.files[0]) {
                fileInput.click();
                return;
            }

            successMsg.style.display = 'none';
            resultDiv.style.display = 'none';
            btn.innerText = 'ЗАГРУЗКА...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    const imgUrl = data.data.url;
                    const bbCode = `[url=${imgUrl}][img]${imgUrl}[/img][/url]`;
                    document.getElementById('imageBbcode').value = bbCode;
                    resultDiv.style.display = 'block';
                    successMsg.style.display = 'block';
                } else {
                    alert('Ошибка загрузки изображения');
                }
            } catch (err) {
                alert('Ошибка сети');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('uploadVideoBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('videoInput');
            const btn = document.getElementById('uploadVideoBtn');
            const successMsg = document.getElementById('videoSuccess');
            const resultDiv = document.getElementById('videoResult');
            const videoPlayer = document.getElementById('videoPlayer');
            const originalText = btn.innerText;

            if (!fileInput.files[0]) {
                fileInput.click();
                return;
            }

            const file = fileInput.files[0];
            if (file.size > 32 * 1024 * 1024) {
                alert('Файл слишком большой. Максимальный размер: 32 МБ.');
                return;
            }

            successMsg.style.display = 'none';
            resultDiv.style.display = 'none';
            btn.innerText = 'ЗАГРУЗКА...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    const videoUrl = data.data.url;
                    videoPlayer.src = videoUrl;
                    videoPlayer.load();

                    const bbCode = `[url=${videoUrl}][img]https://i.imgur.com/PLc7hN1.png[/img][/url]\n\nПрямая ссылка: ${videoUrl}`;
                    document.getElementById('videoBbcode').value = bbCode;
                    resultDiv.style.display = 'block';
                    successMsg.style.display = 'block';
                } else {
                    alert('Ошибка загрузки видео. Возможно формат не поддерживается.');
                }
            } catch (err) {
                alert('Ошибка сети');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        document.getElementById('copyImageBtn').addEventListener('click', () => {
            const textarea = document.getElementById('imageBbcode');
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
        });

        document.getElementById('copyVideoBtn').addEventListener('click', () => {
            const textarea = document.getElementById('videoBbcode');
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
        });
    </script>
</body>
</html>
